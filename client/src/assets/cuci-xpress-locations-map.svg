<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Brunei coastline and shape (simplified) -->
  <g stroke="#94a3b8" stroke-width="2" fill="#e2e8f0">
    <!-- Main Brunei shape -->
    <path d="M150 200 Q200 180 280 190 Q350 200 420 220 Q480 240 520 280 Q540 320 530 360 Q520 400 480 430 Q440 450 380 460 Q320 470 260 460 Q200 450 160 420 Q140 380 150 340 Q155 300 150 260 Z"/>
    
    <!-- Brunei Bay area -->
    <path d="M280 190 Q320 160 380 170 Q420 180 450 200 Q480 220 500 250 Q480 240 420 220 Q350 200 280 190"/>
    
    <!-- Tutong area -->
    <path d="M150 200 Q120 180 100 160 Q90 140 100 120 Q120 110 150 120 Q180 130 200 150 Q190 170 180 180 Q165 190 150 200"/>
  </g>
  
  <!-- Water areas -->
  <g fill="#bfdbfe" opacity="0.7">
    <ellipse cx="400" cy="150" rx="80" ry="30"/>
    <ellipse cx="480" cy="250" rx="60" ry="40"/>
    <ellipse cx="120" cy="140" rx="40" ry="25"/>
  </g>
  
  <!-- Location markers with authentic coordinates -->
  
  <!-- Tungku Link (Main branch - BSB area) -->
  <g transform="translate(320, 280)">
    <circle r="12" fill="#6C5CE7"/>
    <circle r="8" fill="white"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Tungku Link</text>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Bandar Seri Begawan</text>
    <text x="20" y="33" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Daily 8AM-8PM</text>
  </g>
  
  <!-- Salar Link (East of BSB) -->
  <g transform="translate(380, 300)">
    <circle r="12" fill="#FFA500"/>
    <circle r="8" fill="white"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Salar Link</text>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Brunei-Muara</text>
    <text x="20" y="33" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Daily 8AM-8PM</text>
  </g>
  
  <!-- Bengkurong Link (West of BSB) -->
  <g transform="translate(260, 320)">
    <circle r="12" fill="#10B981"/>
    <circle r="8" fill="white"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Bengkurong Link</text>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Brunei-Muara</text>
    <text x="20" y="33" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Daily 8AM-8PM</text>
  </g>
  
  <!-- Tutong Link (Tutong District) -->
  <g transform="translate(150, 160)">
    <circle r="12" fill="#EF4444"/>
    <circle r="8" fill="white"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Tutong Link</text>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Tutong District</text>
    <text x="20" y="33" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Daily 8AM-8PM</text>
  </g>
  
  <!-- Connecting lines showing coverage area -->
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="5,5" fill="none" opacity="0.5">
    <line x1="320" y1="280" x2="380" y2="300"/>
    <line x1="320" y1="280" x2="260" y2="320"/>
    <line x1="320" y1="280" x2="150" y2="160"/>
  </g>
  
  <!-- Title and branding -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="300" height="80" fill="white" stroke="#e5e7eb" rx="8"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6C5CE7">Cuci Xpress Locations</text>
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">4 Strategic Branches Across Brunei</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">100,000+ Cars Cleaned • $1M+ Revenue</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(550, 450)">
    <rect x="0" y="0" width="200" height="120" fill="white" stroke="#e5e7eb" rx="8"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Service Areas</text>
    
    <circle cx="25" cy="40" r="6" fill="#6C5CE7"/>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="11" fill="#374151">Main Branch</text>
    
    <circle cx="25" cy="60" r="6" fill="#FFA500"/>
    <text x="40" y="65" font-family="Arial, sans-serif" font-size="11" fill="#374151">East Branch</text>
    
    <circle cx="25" cy="80" r="6" fill="#10B981"/>
    <text x="40" y="85" font-family="Arial, sans-serif" font-size="11" fill="#374151">West Branch</text>
    
    <circle cx="25" cy="100" r="6" fill="#EF4444"/>
    <text x="40" y="105" font-family="Arial, sans-serif" font-size="11" fill="#374151">Tutong Branch</text>
  </g>
  
  <!-- Scale indicator -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#374151" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#374151" stroke-width="2"/>
    <line x1="50" y1="-5" x2="50" y2="5" stroke="#374151" stroke-width="2"/>
    <text x="25" y="20" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">~10km</text>
  </g>
</svg>