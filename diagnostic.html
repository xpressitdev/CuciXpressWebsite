<!DOCTYPE html>
<html>
<head>
    <title>Google API Diagnostic</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Google API Diagnostic Tool</h1>
    
    <div class="info">
        <h3>Instructions:</h3>
        <ol>
            <li>Ensure Places API is enabled in Google Cloud Console</li>
            <li>Check your API key has Places API permissions</li>
            <li>Verify billing is enabled</li>
            <li>Click "Test API" below</li>
        </ol>
    </div>

    <button onclick="testAPI()">Test API Configuration</button>
    
    <div id="results"></div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">Testing API configuration...</div>';
            
            try {
                const response = await fetch('/api/test-google-api');
                const data = await response.json();
                
                let statusClass = data.status === 'OK' ? 'success' : 'error';
                
                resultsDiv.innerHTML = `
                    <div class="${statusClass}">
                        <h3>API Test Results</h3>
                        <p><strong>Status:</strong> ${data.status}</p>
                        <p><strong>Message:</strong> ${data.message}</p>
                        ${data.businessName ? `<p><strong>Business:</strong> ${data.businessName}</p>` : ''}
                        ${data.rating ? `<p><strong>Rating:</strong> ${data.rating}</p>` : ''}
                    </div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                if (data.status === 'OK') {
                    resultsDiv.innerHTML += '<div class="success"><strong>✅ Success!</strong> Your API is working. The website will now show real Google reviews.</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error"><strong>Network Error:</strong> ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
